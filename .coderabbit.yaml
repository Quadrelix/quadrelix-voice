# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit (AI code review) settings for this repo.
#
# Why this file exists: by default CodeRabbit only auto-reviews PRs into the
# default branch (main). Every PR here goes into voice-lock-integration, so it
# skipped all of them. Listing that branch below turns reviews on.
#
# CodeRabbit only comments; it never blocks a merge. The required gate is CI
# (.github/workflows/backend.yml and mobile.yml).

language: en-US

reviews:
  profile: chill            # fewer, more important comments
  auto_review:
    enabled: true
    base_branches:
      - voice-lock-integration
  # Lock files are generated by npm; reviewing them is noise.
  path_filters:
    - "!**/package-lock.json"
